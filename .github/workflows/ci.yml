name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'openspec/**'
      - 'prisma/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'openspec/**'
      - 'prisma/**'
      - 'scripts/**'

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-for-production
      TEST_AUTH_SECRET: ci-test-bypass-secret
      TEST_AUTH_EMAIL: e2e-test@example.com

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Run database migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Seed database
        run: pnpm run seed

      - name: Lint
        run: pnpm run lint

      - name: Lint specs (traceability)
        run: pnpm run lint:specs

      - name: Lint specs (given clause)
        run: pnpm run lint:given

      - name: Lint issue links
        run: pnpm run lint:issue-link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint schema parity
        run: pnpm run lint:schema-parity

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test -- --run

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2e tests
        run: pnpm run test:e2e
