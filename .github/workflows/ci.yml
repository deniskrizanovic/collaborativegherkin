name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'openspec/**'
      - 'drizzle/**'
      - 'drizzle.*.config.ts'
      - 'scripts/**'
      - 'robot/**'
      - 'e2e/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/**'
      - '.oxlintrc.json'
      - 'biome.json'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - 'server.js'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'openspec/**'
      - 'drizzle/**'
      - 'drizzle.*.config.ts'
      - 'scripts/**'
      - 'robot/**'
      - 'e2e/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/**'
      - '.oxlintrc.json'
      - 'biome.json'
      - 'tsconfig.json'
      - 'next.config.*'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - 'server.js'

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-for-production
      TEST_AUTH_SECRET: ci-test-bypass-secret
      TEST_AUTH_EMAIL: e2e-test@example.com

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DATABASE_URL is relative to the working directory: repo-root ci.db.
      - name: Run database migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm run seed

      - name: Lint
        run: pnpm run lint

      # Formatting and import order, checked across the whole tree.
      - name: Lint format
        run: pnpm run lint:format

      - name: Lint specs (traceability)
        run: pnpm run lint:specs

      - name: Lint specs (given clause)
        run: pnpm run lint:given

      - name: Lint issue links
        run: pnpm run lint:issue-link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint schema parity
        run: pnpm run lint:schema-parity

      - name: Lint Dependabot config
        run: pnpm run lint:dependabot

      - name: Lint robot (no Sleep)
        run: pnpm run lint:robot

      - name: Lint robot (spec steps)
        run: pnpm run lint:robot-steps

      - name: Lint e2e parity
        run: pnpm run lint:e2e-parity

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test -- --run

      # CRAP score per function under src/ (complexity vs unit-test coverage).
      # Re-runs the unit suite under istanbul coverage, so it is not in the
      # husky pre-commit hook.
      - name: Lint CRAP score
        run: pnpm run lint:crap

      # Python + Robot Framework toolchain for the Robot e2e suite (robot/).
      # uv installs the Python pinned in .python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # Point Robot's Browser library at the same browser directory Playwright
      # uses, so the cache below covers both. (`rfbrowser init` otherwise puts
      # browsers inside its wrapper node_modules, which `npm ci` wipes each run.)
      - name: Share Playwright browser path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache browser and Browser-library downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: browsers-${{ runner.os }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Robot toolchain
        run: pnpm run test:robot:init

      - name: Robot e2e tests
        run: pnpm run test:robot

      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results
          path: robot/results/
