name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'openspec/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'robot/**'
      - 'e2e/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'openspec/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'robot/**'
      - 'e2e/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-for-production
      TEST_AUTH_SECRET: ci-test-bypass-secret
      TEST_AUTH_EMAIL: e2e-test@example.com

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Run database migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Seed database
        run: pnpm run seed

      - name: Lint
        run: pnpm run lint

      - name: Lint specs (traceability)
        run: pnpm run lint:specs

      - name: Lint specs (given clause)
        run: pnpm run lint:given

      - name: Lint issue links
        run: pnpm run lint:issue-link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint schema parity
        run: pnpm run lint:schema-parity

      - name: Lint robot (no Sleep)
        run: pnpm run lint:robot

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test -- --run

      # Python + Robot Framework toolchain for the Robot e2e suite (robot/).
      # uv installs the Python pinned in .python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # Point Robot's Browser library at the same browser directory Playwright
      # uses, so the cache below covers both. (`rfbrowser init` otherwise puts
      # browsers inside its wrapper node_modules, which `npm ci` wipes each run.)
      - name: Share Playwright browser path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache browser and Browser-library downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: browsers-${{ runner.os }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Robot toolchain
        run: pnpm run test:robot:init

      - name: E2e tests
        run: pnpm run test:e2e

      - name: Robot e2e tests
        run: pnpm run test:robot

      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: robot/results/
