version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "deniskrizanovic"
    groups:
      minor-and-patch:
        update-types:
          - "minor"W
          - "patch"
    ignore:
      - dependency-name: "next-auth"
        update-types: ["version-update:semver-major"]
