name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'openspec/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'openspec/**'

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-for-production
      TEST_AUTH_SECRET: ci-test-bypass-secret
      TEST_AUTH_EMAIL: e2e-test@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Run database migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Seed database
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Lint specs (traceability)
        run: npm run lint:specs

      - name: Lint specs (given clause)
        run: npm run lint:given

      - name: Lint issue links
        run: npm run lint:issue-link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2e tests
        run: npm run test:e2e
